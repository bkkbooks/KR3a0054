body:
  text: 子思子全書儒家類提要臣等謹案子思子全書一卷宋汪晫編考朝公武讀書志載有子思子七卷晫蓋亦未見其本故别作是書凡九篇內篇天命第一鳶魚第二誠明第三外篇無憂第四胡母豹第五喪服第六魯繆公第七任賢第八過齊第九其割裂中庸别立名目與曽子載孝經大學同又晫輯曽子用朱子改本大學至孔叢一書朱子反覆辨其偽而晫采之獨多已失鑒别又往往竄亂原文如孔叢子子上雜所習請于子思注曰雜者諸子百家故下文子思答曰雜説不存焉此書引之改曰子上請所習于子思則與子思答義全不相貫孔叢子仲尼曰由乎心心之精神是謂聖推數究理不一疑此書引之聖字下多一區字疑字上多一物字又孔叢子云伋于進瞻亟聞夫子之教此書引之以進瞻作進善輕改舊文均失先儒詳慎之道且與曽子所引均不著其出典亦非輯録古書之體較薛據孔子集語蓋瞪乎後矣特以書中所録雖真贋互見然多先賢之格言故雖編次蹖駁至今不得而廢焉乾隆四十六年九月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀
  hash: sha256:42479b87964114e11c70e63e638156fcb98f56ae6e37b712c02ca96a2830c960
